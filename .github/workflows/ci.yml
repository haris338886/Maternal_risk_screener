name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train model (needed before AppTest)
        run: python -c "from src.train import train_and_save; train_and_save()"

      - name: Run smoke tests (AppTest + out-of-range)
        run: pytest tests/ -v